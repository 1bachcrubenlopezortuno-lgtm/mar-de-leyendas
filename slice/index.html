<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>Mar de Leyendas — prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Lilita+One&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--perg:#e9d8a6;--perg2:#d4b97e;--perg3:#f3e6c4;--tinta:#3b2a14;--tinta2:#6b4f2a;--lacre:#9b2226;--oro:#c9a227;--verde:#4f772d;--azul:#1d4e89}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0906;color:var(--tinta);font-family:'Baloo 2',system-ui,sans-serif;font-weight:600;font-size:20px;line-height:1.2}
#stage{position:absolute;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#1b120b}
#rotate{position:fixed;inset:0;z-index:99;background:#1b120b;color:var(--perg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Lilita One';font-size:30px;text-align:center;padding:20px}
#rotate .ph{font-size:70px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
.perg{background:radial-gradient(ellipse at 50% 40%,var(--perg3) 0%,var(--perg) 55%,var(--perg2) 100%);color:var(--tinta);border:2px solid var(--tinta);box-shadow:inset 0 0 22px rgba(107,79,42,.55),3px 3px 0 rgba(18,12,7,.8)}
h1,h2,h3,.pir{font-family:'Lilita One',serif;font-weight:normal;letter-spacing:.5px}
h1{font-size:56px;line-height:1;color:var(--lacre);font-family:'Pirata One',serif}h2{font-size:28px;line-height:1.1}h3{font-size:22px}
.num{font-family:'Lilita One',sans-serif;font-size:20px;font-weight:normal}
.abs{position:absolute}
.full{position:absolute;inset:0}
button{font-family:'Baloo 2',serif;font-size:19px;line-height:1.2;color:var(--tinta);cursor:pointer;width:100%;text-align:left;padding:8px 12px 8px 40px;position:relative;background:radial-gradient(ellipse at 50% 40%,var(--perg3) 0%,var(--perg) 60%,var(--perg2) 100%);border:2px solid var(--tinta);box-shadow:inset 0 0 14px rgba(107,79,42,.45),2px 2px 0 #120c07}
button::before{content:'';position:absolute;left:12px;top:50%;width:17px;height:17px;margin-top:-8.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9343a,var(--lacre) 60%,#5c0f12)}
button:active{transform:translate(1px,1px)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:disabled::before{background:#8a7a5c}
button small{display:block;font-weight:500;font-size:15px;color:var(--tinta2);margin-top:1px}
button.primary{background:radial-gradient(ellipse at 50% 40%,#c0392b,var(--lacre) 70%,#6a1518);color:var(--perg3);text-align:center;padding-left:12px;font-family:'Lilita One';font-size:26px}
button.primary small{color:var(--perg)}
button.plain{padding-left:12px;text-align:center}
button.primary::before,button.plain::before,button.ico::before{display:none}
button.ico{width:auto;padding:2px 10px;font-size:24px;text-align:center}
.muted{color:var(--tinta2);font-weight:500}
img.spr{image-rendering:pixelated;display:block}
.row{display:flex;gap:8px;align-items:center}
/* HUD */
.hud{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:10px;padding:4px 10px;z-index:10;border-width:0 0 3px 0}
.crewbar{display:flex;gap:6px}
.port{width:44px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring{width:42px;height:42px;border-radius:50%;border:2px solid var(--tinta);background:#cdb37a;overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
.mini{height:5px;width:40px;background:#8a7a5c;border:1px solid var(--tinta);position:relative}
.mini>i{position:absolute;inset:0 auto 0 0;background:var(--lacre)}
.hudmid{flex:1;display:flex;justify-content:center;gap:16px;font-family:'Lilita One';font-size:20px}
.low{color:var(--lacre);font-weight:bold;animation:blink 1s infinite}
.quest{position:absolute;left:10px;bottom:10px;max-width:520px;font-size:17px;padding:5px 10px;z-index:9}
.mapbtn{position:absolute;right:12px;bottom:12px;width:auto;z-index:9}
#cv{position:absolute;inset:0;width:960px;height:540px;image-rendering:pixelated;touch-action:manipulation}
#mini{position:absolute;right:10px;top:66px;width:160px;height:104px;border:2px solid var(--tinta);z-index:9;image-rendering:pixelated;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:30;padding:6px 16px;font-size:19px;animation:toast 2.2s forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes blink{50%{opacity:.35}}
/* Escenas */
.vnbg{position:absolute;inset:0;background-size:cover!important;background-position:center!important}
.vnbg::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 80px rgba(30,20,10,.6);pointer-events:none}
.place{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-family:'Lilita One';font-size:24px;padding:2px 18px;z-index:3;white-space:nowrap}
.cast{position:absolute;bottom:150px;display:flex;align-items:flex-end;z-index:2}
.cast.l{left:20px}.cast.r{right:20px;flex-direction:row-reverse}
.cast .ch{transition:filter .25s,transform .25s;margin:0 -26px;filter:brightness(.45) saturate(.6)}
.cast .ch.on{filter:none;transform:translateY(-8px)}
.cast.r .ch img{transform:scaleX(-1)}
.cast .ch.enter{animation:enter .35s}
@keyframes enter{from{opacity:0;transform:translateY(24px)}}
.dlg{position:absolute;left:16px;right:16px;bottom:12px;height:132px;padding:24px 22px 12px;cursor:pointer;z-index:4}
.who{position:absolute;top:-18px;left:18px;font-family:'Lilita One';font-size:24px;padding:0 14px;background:var(--lacre);color:var(--perg3);border:2px solid var(--tinta)}
.txt{font-size:22px;line-height:1.3}.txt.narr{color:var(--tinta2);font-weight:500}
.tri{position:absolute;right:14px;bottom:8px;font-size:16px;animation:blink 1s infinite}
.choices{position:absolute;right:16px;top:110px;width:440px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;z-index:5;padding:2px}
.choices button{animation:enter .3s backwards}
.choices.wide{left:50%;transform:translateX(-50%);right:auto}
/* Combate */
.bfield{position:absolute;inset:0;background-size:cover!important;background-position:center!important}
.bfield::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(20,12,6,.55));pointer-events:none}
.unit{position:absolute;display:flex;flex-direction:column;align-items:center;width:150px;transition:opacity .3s,filter .3s;z-index:2}
.unit .spw{position:relative;height:104px;display:flex;align-items:flex-end}
.unit.e .spw img{transform:scaleX(-1)}
.unit .plate{width:146px;padding:2px 6px;background:rgba(243,230,196,.93);border:2px solid var(--tinta);border-radius:3px;margin-top:-4px}
.unit .nm{font-family:'Lilita One';font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .nums{font-family:'Lilita One';font-size:15px;line-height:1.1}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.dead.hasko{opacity:1;filter:none}.unit.dead.hasko .plate{opacity:.4;filter:grayscale(1)}
.spw img.tecov{position:absolute;left:-18px;bottom:0;width:auto!important;z-index:3}
.unit.turn .plate{border-color:#e0a800;box-shadow:0 0 0 3px #f2c14e,0 0 14px #f2c14e}
.unit.turn .spw::after{content:'▼';position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:#f2c14e;font-size:20px;text-shadow:0 0 4px #000;animation:blink .8s infinite}
.unit.tgt{cursor:pointer}
.unit.tgt .plate{border-color:#d00000;box-shadow:0 0 0 3px #e63946,0 0 16px #e63946;animation:tg .7s infinite}
.unit.tgt.ally .plate{border-color:#2d6a4f;box-shadow:0 0 0 3px #52b788,0 0 16px #52b788}
@keyframes tg{50%{transform:scale(1.05)}}
.lunge-r .spw{animation:lr .32s}.lunge-l .spw{animation:ll .32s}
@keyframes lr{50%{transform:translateX(34px)}}@keyframes ll{50%{transform:translateX(-34px)}}
.hitf .spw{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{height:7px;background:#5c4a32;border:1px solid var(--tinta);position:relative;margin-top:2px}
.bar>i{position:absolute;left:0;top:0;bottom:0;transition:width .3s}
.bar.hp>i{background:linear-gradient(#7bc96f,#3f8f3a)}.bar.hp.e>i{background:linear-gradient(#ef6f6c,#b0302d)}
.bar.pe>i{background:linear-gradient(#6ec6f0,#2a6f97)}
.chips{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:3px;white-space:nowrap;z-index:4;pointer-events:none}
.chip{font-family:'Lilita One';font-size:14px;line-height:1;padding:3px 7px;border-radius:12px;border:2px solid #1b120b;color:#fff;box-shadow:1px 2px 0 rgba(0,0,0,.45);text-shadow:1px 1px 0 rgba(0,0,0,.4);animation:pop .35s}
.chip.up{background:linear-gradient(#ff9f43,#e8590c)}.chip.down{background:linear-gradient(#a06cd5,#6a3d9a)}
.chip.def{background:linear-gradient(#4dabf7,#1c7ed6)}.chip.bleed{background:linear-gradient(#ff6b6b,#c1121f);animation:pop .35s,throb 1s infinite}
.chip.guard{background:linear-gradient(#adb5bd,#495057)}.chip.globo{background:linear-gradient(#ffd166,#f4a261);color:#3b2a14;text-shadow:none}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes throb{50%{transform:scale(1.12)}}
.unit.buffed .spw img{filter:drop-shadow(0 0 5px #ff9f43) drop-shadow(0 0 2px #ff9f43)}
.unit.guarding .spw img{filter:drop-shadow(0 0 6px #4dabf7) drop-shadow(0 0 2px #4dabf7)}
.unit.bleeding .spw{animation:redpulse 1s infinite}
@keyframes redpulse{50%{filter:drop-shadow(0 0 8px #ff2b2b) saturate(1.4)}}
.unit.ballooned .spw img{filter:drop-shadow(0 0 7px #ffd166)}
.burst{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:5px solid;pointer-events:none;animation:burst .6s forwards;z-index:3}
.burst.up{border-color:#ff9f43}.burst.def,.burst.guard{border-color:#4dabf7}.burst.bleed{border-color:#ff2b2b}.burst.heal{border-color:#52b788}.burst.globo{border-color:#ffd166}
@keyframes burst{to{transform:scale(5);opacity:0}}
.float.st{font-size:24px;padding:2px 10px;border-radius:14px;border:2px solid #1b120b;text-shadow:1px 1px 0 rgba(0,0,0,.4);color:#fff;animation:upst 1.3s forwards}
.float.st.up{background:#e8590c}.float.st.def{background:#1c7ed6}.float.st.bleed{background:#c1121f}.float.st.guard{background:#495057}.float.st.globo{background:#f4a261;color:#3b2a14}
@keyframes upst{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-40px}}
.float{position:absolute;top:10px;left:50%;font-family:'Lilita One';font-size:30px;color:#e63946;text-shadow:2px 2px 0 #1b120b,-1px -1px 0 #1b120b;animation:up .95s forwards;pointer-events:none;z-index:6;white-space:nowrap;transform:translateX(-50%)}
.float.crit{font-size:36px;color:#ffb703}.float.heal{color:#52b788}.float.info{color:#8ecae6;font-size:24px}.float.pe{color:#4cc9f0;font-size:26px}.float.buff{color:#f4a261;font-size:24px}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}
.banner{position:absolute;left:0;right:0;top:170px;text-align:center;font-family:'Lilita One';font-size:46px;pointer-events:none;animation:ban 1.2s forwards;z-index:7;text-shadow:3px 3px 0 #1b120b,-2px -2px 0 #1b120b}
.banner.atk{color:#ff6b6b}.banner.tec{color:#7ec8ff}.banner.combo{color:#ffd166}.banner.foe{color:#ff8c42}.banner.win{color:#ffd166}.banner.lose{color:#adb5bd}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.queue{position:absolute;top:64px;left:12px;display:flex;gap:4px;padding:4px 8px;z-index:5;align-items:center}
.queue .lab{font-family:'Lilita One';font-size:16px;margin-right:4px}
.queue .q{width:36px;height:36px;border:3px solid #2a6f97;border-radius:50%;overflow:hidden;background:#cfe3ef}
.queue .q.e{border-color:#b0302d;background:#f2d0cf}
.queue .q.now{transform:scale(1.18);box-shadow:0 0 0 2px #f2c14e,0 0 10px #f2c14e}
.blog{position:absolute;left:12px;bottom:12px;width:380px;height:118px;font-size:17px;padding:8px 12px;z-index:5;overflow:hidden}
.blog .l0{font-weight:bold}.blog .lp{color:#1d4e89}.blog .le{color:#9b2226}.blog .lx{color:#6b4f2a}
.cmd{position:absolute;right:12px;bottom:12px;width:540px;z-index:5}
.cmdhead{padding:4px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:19px}
.cmdhead.foe{background:linear-gradient(90deg,#9b2226,#6a1518);color:var(--perg3)}
.cmdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cmdlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:190px;overflow-y:auto}
.cbtn{color:#fff;text-align:center;padding:9px 6px 7px;font-family:'Lilita One';font-size:21px;letter-spacing:.3px;text-shadow:1px 1px 0 rgba(0,0,0,.5);border:2px solid #1b120b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.25),2px 2px 0 #120c07}
.cbtn::before{display:none}
.cbtn small{color:rgba(255,255,255,.9);font-family:'Baloo 2';font-weight:600;font-size:14px;text-shadow:none}
.cbtn.atk{background:linear-gradient(#e05a47,#a8321f)}
.cbtn.tec{background:linear-gradient(#4a90d9,#24609e)}
.cbtn.obj{background:linear-gradient(#6fb04a,#3f7a25)}
.cbtn.def{background:linear-gradient(#8d99ae,#4d5a70)}
.cbtn.run{background:linear-gradient(#e0a03a,#a8691a)}
.cbtn.back{background:linear-gradient(#a39a83,#6e6656);font-size:19px}
.cbtn.t-one{background:linear-gradient(#e0703a,#a8441a)}.cbtn.t-all{background:linear-gradient(#9b6bd6,#5e3a9e)}
.cbtn.t-ally{background:linear-gradient(#52b788,#2d6a4f)}.cbtn.t-self{background:linear-gradient(#4a90d9,#24609e)}
.cbtn.t-combo{background:linear-gradient(#f2c14e,#c08a10);color:#3b2a14;text-shadow:none}.cbtn.t-combo small{color:#3b2a14}
.cbtn.t-item{background:linear-gradient(#6fb04a,#3f7a25)}
.cbtn{font-size:21px;text-align:left;padding-left:12px}.cmdgrid .cbtn{text-align:center;padding-left:6px}
.pe-tag{float:right;font-family:'Lilita One';font-size:16px;background:rgba(0,0,0,.3);padding:0 6px;border-radius:3px}
/* Bitácora */
.modal{position:absolute;inset:0;background:rgba(18,12,7,.75);display:flex;align-items:center;justify-content:center;z-index:40}
.modal>.card{width:860px;height:500px;padding:12px 16px;display:flex;flex-direction:column}
.mbody{flex:1;overflow-y:auto;padding-right:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px}
.tabs button{width:auto;padding:3px 12px;font-size:17px}.tabs button::before{display:none}
.tabs button.on{background:var(--lacre);color:var(--perg3)}
.slot{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:4px 0;border-bottom:1px dashed var(--tinta2);gap:8px}
.pick{display:flex;gap:12px;align-items:center}.pick img{flex:none}
.sk{padding:6px 0;border-bottom:1px dashed var(--tinta2)}
.lock{opacity:.5}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;padding:18px 24px;text-align:center;z-index:20}

/* Menú de pausa */
.menubtn{font-family:'Lilita One';font-size:20px;padding:4px 14px}
.pov{position:absolute;inset:0;background:rgba(18,12,7,.5);z-index:40}
.pmenu{position:absolute;right:12px;top:66px;width:262px;padding:10px;z-index:43;display:flex;flex-direction:column;gap:5px;animation:slidein .18s}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.pmenu button{font-family:'Lilita One';font-size:20px;padding:5px 10px 5px 52px;text-align:left}
.pmenu button::before{display:none}
.pmenu button .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:24px;width:32px;text-align:center}
.pmenu button.sel{background:radial-gradient(ellipse,#fff3c4,#ffd166);box-shadow:inset 0 0 0 3px var(--lacre),2px 2px 0 #120c07}
.pmenu button.sel::after{content:'▶';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--lacre);font-size:16px}
.pdetail{position:absolute;left:12px;top:66px;right:288px;bottom:12px;padding:12px 18px;z-index:42;overflow-y:auto;animation:slidein .18s}
.pdetail h2{margin-bottom:6px}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--tinta2);font-size:18px}
.qrow .ck{font-size:20px;width:26px;flex:none}
.qrow.done{color:var(--tinta2)}.qrow.done span.t{text-decoration:line-through}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--tinta2);font-size:19px;gap:10px}
.sw{display:flex;gap:4px}.sw button{width:auto;padding:4px 12px;font-size:16px}.sw button::before{display:none}.sw button.on{background:var(--lacre);color:var(--perg3)}
textarea.code{width:100%;height:70px;font-family:monospace;font-size:12px;border:2px solid var(--tinta);background:var(--perg3);padding:6px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="rotate"><div class="ph">📱</div>Gira el móvil para jugar<div style="font-family:'Baloo 2';font-size:18px">Mar de Leyendas se juega en horizontal</div></div>
<script>
/* =========================================================================
   MAR DE LEYENDAS — v0.6 (versión para amigos) · formato horizontal 960x540
   ASSETS: sprites de Rubén (PNG 64x64 transparente, mirando a la derecha)
   ========================================================================= */
const ASSETS={
  ...Object.fromEntries(['luffy','zoro','coby','nami','sanji','chopper','helmeppo','morgan','bucanero','cangrejo','tabernera','marine','fusilero','mercader','reymarino'].map(k=>[k,{idle:[`sprites/${k}_reposo_1.png`,`sprites/${k}_reposo_2.png`],atk:`sprites/${k}_ataque.png`,hit:`sprites/${k}_golpe.png`}]))
};
ASSETS.luffy.tec=['sprites/luffy_tecnica_0.png','sprites/luffy_tecnica_1.png'];ASSETS.luffy.ko='sprites/luffy_ko.png';
ASSETS.luffywin={idle:['sprites/luffy_victoria_0.png','sprites/luffy_victoria_1.png']};
/* Luffy caminando por las islas: 0-2 abajo, 3-5 arriba, 6-11 derecha (izquierda = espejo) */
const WALK={down:[0,1,2],up:[3,4,5],right:[6,7,8,9,10,11]};
const walkSrc=i=>`sprites/luffy_walk_${String(i).padStart(2,'0')}.png`;
const ASSETS_BG={}; // p. ej. playa:'fondos/playa.png'

const W=960,H=540;
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-W*s)/2+'px';stage.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',fit);fit();
const later=(fn,ms)=>window.SIM?fn():setTimeout(fn,ms);
const rand=Math.random,ri=(a,b)=>a+Math.floor(rand()*(b-a+1)),pick=a=>a[Math.floor(rand()*a.length)],chance=p=>rand()<p,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,y,s=0){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}

/* ------------------------------------------------------------------------
   SPRITES PROVISIONALES (genéricos). Con nombre propio = silueta.
   ------------------------------------------------------------------------ */
function makeSprite(o){
  const c=document.createElement('canvas');c.width=32;c.height=32;const x=c.getContext('2d');

}

function playMusic(name,force){
  AU.want=name;if(!AU.ctx||window.SIM)return;if(AU.track===name&&!force)return;
  AU.track=name;AU.step=0;AU.next=AU.ctx.currentTime+.08;
  if(!AU.timer)AU.timer=setInterval(schedMusic,30);
}
function stopMusic(){AU.track=null;AU.want=null}
function schedMusic(){
  const c=AU.ctx;if(!c||!AU.track)return;const S=SONGS[AU.track],dt=60/S.bpm;
  while(AU.next<c.currentTime+.15){
    const st=AU.step%S.len,t=AU.next;
    if(AU.music){
      S.L.notes.forEach(([s0,n,l])=>{if(s0===st){tone(nf(n),l*dt*.92,S.leadType,S.leadVol,t,null,AU.mus);tone(nf(n)*1.005,l*dt*.9,S.leadType,S.leadVol*.35,t+.01,null,AU.mus)}});
      S.B.notes.forEach(([s0,n,l])=>{if(s0===st)tone(nf(n),l*dt*.85,'triangle',.26,t,null,AU.mus)});
      const dch=S.drums[st%S.drums.length];
      if(dch==='k')tone(120,.12,'sine',.5,t,40,AU.mus);
      if(dch==='s')noise(.09,.25,'bandpass',1800,t,AU.mus);
      if(dch==='h')noise(.03,.08,'highpass',7000,t,AU.mus);
    }
    AU.next+=dt;AU.step++;
  }
}

function stat(m,s){

let LOOP=null,MV=null,CAM={x:0,y:0};

function camTo(px,py,ww,wh){CAM.x=clamp(px-W/2,0,Math.max(0,ww-W));CAM.y=clamp(py-H/2+20,-60,Math.max(0,wh-H))}
// mover: path de casillas, cada paso dura dur ms; onStep(x,y) devuelve true para parar
function moveAlong(path,from,dur,onStep,onEnd){
  if(window.SIM){let cur=from;for(const p of path){if(onStep(p[0],p[1],cur))return;cur=p}onEnd&&onEnd();return}
  MV={path:[...path],from:[...from],to:path[0],t0:performance.now(),dur,onStep,onEnd};
}
function mvPos(now,base){
  if(!MV)return base;
  let p=(now-MV.t0)/MV.dur;
  while(MV&&p>=1){const [x,y]=MV.to,prev=MV.from;const stop=MV.onStep(x,y,prev);if(!MV)return base;
    if(stop||MV.path.length<=1){const e=MV.onEnd;MV=null;if(!stop&&e)e();return null}
    MV.path.shift();MV.from=[x,y];MV.to=MV.path[0];MV.t0+=MV.dur;p=(now-MV.t0)/MV.dur}
  if(!MV)return base;
  return{x:MV.from[0]+(MV.to[0]-MV.from[0])*p,y:MV.from[1]+(MV.to[1]-MV.from[1])*p,moving:true};
}
function bfs(w,h,walk,sx,sy,tx,ty){
  const key=(x,y)=>y*w+x,prev=new Map([[key(sx,sy),null]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty){const p=[];let k=key(x,y);while(k!==key(sx,sy)){p.unshift([k%w,Math.floor(k/w)]);k=prev.get(k)}return p}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const k=key(nx,ny);if(prev.has(k))continue;if(!walk(nx,ny)&&!(nx===tx&&ny===ty))continue;prev.set(k,key(x,y));q.push([nx,ny])}}
  return null;
}

function walkTo(tx,ty){

  if(!islWalk(I,tx,ty))return;
  const path=bfs(IW,I.map.length,(x,y)=>islWalk(I,x,y)&&!/[a-z]/.test(tileAt(I,x,y)),G.isl.x,G.isl.y,tx,ty);if(!path||!path.length)return;
  moveAlong(path,[G.isl.x,G.isl.y],150,(x,y,prev)=>{sfx('step');G.isl.dir=x<prev[0]?'left':x>prev[0]?'right':y<prev[1]?'up':'down';if(x!==prev[0])G.isl.face=x<prev[0]?-1:1;const c=tileAt(I,x,y);
      if(/[a-z]/.test(c)){MV=null;save();later(()=>poi(G.isl.id,c),60);return true}
      G.isl.x=x;G.isl.y=y;return false},()=>save());

function sailTo(tx,ty){

    let best=null;for(let y=ty-7;y<=ty+7;y++)for(let x=tx-7;x<=tx+7;x++)if(seaWalk(x,y)){const d=Math.hypot(x-tx,y-ty);if(!best||d<best[2])best=[x,y,d]}
    if(!best)return;tx=best[0];ty=best[1]}
  const path=(seaT(tx,ty)!=='s'&&bfs(SW,SH,(x,y)=>seaWalk(x,y)&&seaT(x,y)!=='s',G.sea.x,G.sea.y,tx,ty))||bfs(SW,SH,(x,y)=>seaWalk(x,y),G.sea.x,G.sea.y,tx,ty);if(!path||!path.length)return;
  moveAlong(path,[G.sea.x,G.sea.y],190,(x,y,prev)=>{G.sea.face=x<prev[0]?-1:x>prev[0]?1:G.sea.face;G.sea.x=x;G.sea.y=y;const ev=seaStep();drawMini();refreshHud();

    ()=>{save();renderSea()});

function randWater(minDist,cond){for(let k=0;k<400;k++){const x=ri(1,SW-2),y=ri(1,SH-2);if(!seaWalk(x,y)||SEA[y][x].d<1.5)continue;if(Math.hypot(x-G.sea.x,y-G.sea.y)<minDist)continue;if(cond&&!cond(x,y))continue;return[x,y]}return[30,12]}

function entStep(){
  const ents=G.sea.ents||[],px=G.sea.x,py=G.sea.y;
  for(const e of ents){
    if(e.gone){if(--e.back<=0){Object.assign(e,spawnEnt(e.k))}continue}
    if(e.k==='barril')continue;
    if(e.cd>0){e.cd--;continue}
    const dist=Math.hypot(e.x-px,e.y-py),chase=dist<=(e.k==='rey'?4:5)&&!adjIsland();
    if(chase&&!e.alert){e.alert=performance.now();sfx('alert')}
    if(!chase)e.alert=0;
    if(chase&&(G.sea.steps%3===2))continue; // van algo más lentos que tú: se les puede dar esquinazo
    let best=null;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=e.x+dx,ny=e.y+dy;if(!seaWalk(nx,ny))continue;if(e.k==='rey'&&!isDeep(nx,ny))continue;
      const sc=chase?Math.hypot(nx-px,ny-py):Math.hypot(nx-e.hx,ny-e.hy)>6?Math.hypot(nx-e.hx,ny-e.hy):rand()*6;if(!best||sc<best[2])best=[nx,ny,sc,dx]}

  return null;
}

let B=null,PEND=null;
const SLOTS={p:[[385,300],[240,312],[95,300]],e:[[575,300],[720,312],[865,300]]};
function startBattle(keys,opt={}){
  stopMaps();const snap=JSON.stringify(G);playMusic(opt.boss||keys.some(k=>FOES[k].elite)?'boss':'battle');
  const P=G.crew.slice(0,3).map((m,i)=>({uid:'p'+i,key:m.key,side:'p',n:CHARS[m.key].n,hp:Math.max(1,m.hp),max:stat(m,'hp'),pe:m.pe,peMax:stat(m,'pe'),atk:stat(m,'atk'),def:stat(m,'def'),spd:stat(m,'spd'),ref:m,alive:true,buff:null,bleed:0}));
  const E=keys.map((k,i)=>{const f=FOES[k];return{uid:'e'+i,key:k,side:'e',n:f.n,hp:f.hp,max:f.hp,atk:f.atk,def:f.def,spd:f.spd,alive:true,buff:null,bleed:0,defBonus:0}});
  B={P,E,all:[...P,...E],opt,snap,keys,queue:[],cur:null,mode:'wait',log:[],round:0,rage:false};
  drawBattle();
  if(opt.cannons)later(()=>{E.forEach(e=>hit(null,e,0,{fixed:12}));logB('¡La andanada de cañones les pilla de lleno!','x');refreshUnits()},500);
  if(opt.tutorial)logB('Consejo: elige una acción y luego toca al objetivo.','x');
  later(newRound,opt.cannons?1100:700);
}
function logB(t,c='x'){if(!B)return;B.log.unshift([t,c]);B.log.length=Math.min(B.log.length,4);const l=document.getElementById('blog');if(l)l.innerHTML=B.log.map(([x,cc],i)=>`<div class="l${cc} ${i?'':'l0'}">${x}</div>`).join('')}
function aliveS(s){return B.all.filter(u=>u.side===s&&u.alive)}
function newRound(){if(!B)return;B.round++;B.queue=B.all.filter(u=>u.alive).sort((a,b)=>(b.spd+rand()*.9)-(a.spd+rand()*.9));nextTurn()}
function nextTurn(){
  if(checkEnd())return;
  if(!B.queue.length)return newRound();
  const u=B.queue.shift();if(!u.alive)return nextTurn();
  B.cur=u;u.defend=false;u.globo=false;
  if(u.buff){u.buff.t--;if(u.buff.t<=0){u.buff=null;fx(u,'Ataque normal','info')}}
  if(u.bleed>0){hit(null,u,0,{fixed:u.bleed,quiet:true});logB(`${u.n} sangra (${u.bleed}).`,u.side);u.bleed=Math.max(0,u.bleed-1);if(!u.alive){refreshUnits();return later(nextTurn,500)}}
  if(u.side==='p'){u.pe=Math.min(u.peMax,u.pe+1);B.mode='menu'}else B.mode='wait';
  refreshUnits();drawQueue();drawMenu();
  if(u.side==='e')later(()=>enemyAct(u),750);
}
function atkOf(u){return u.atk*(u.buff?u.buff.m:1)}
function hit(src,tgt,pow,o={}){
  if(!tgt.alive)return 0;
  if(src&&tgt.key==='luffy'&&o.ranged){const d=Math.max(1,Math.round(atkOf(src)*pow));sfx('boing');fx(tgt,'¡Boing!','info');logB('¡Las balas rebotan en el cuerpo de goma de Luffy!','p');return hit(null,src,0,{fixed:d})}
  if(src&&tgt.globo&&!o.ranged){const d=Math.max(1,Math.round(atkOf(src)*pow));fx(tgt,'¡Globo!','info');return hit(null,src,0,{fixed:d})}
  let d,crit=false;
  if(o.fixed)d=o.fixed;else{d=atkOf(src)*pow*(.9+rand()*.2)-(tgt.def+(tgt.defBonus||0))*.6;crit=rand()<.08;if(crit)d*=1.5;d=Math.max(1,Math.round(d))}
  if(tgt.defend&&!o.fixed)d=Math.max(1,Math.round(d*.5));
  tgt.hp-=d;fx(tgt,(crit?'¡CRÍTICO! ':'')+'-'+d,crit?'crit':'');sfx(crit?'crit':o.ranged?'shot':src&&['zoro','marine','morgan','helmeppo'].includes(src.key)?'slash':'hit');
  const el=uEl(tgt);if(el){el.classList.remove('hitf');void el.offsetWidth;el.classList.add('hitf');pose(el.querySelector('img'),'hit',380)}
  if(tgt.hp<=0){tgt.hp=0;tgt.alive=false;if(!o.quiet)logB(`${tgt.n} cae.`,tgt.side==='e'?'p':'e')}
  return d;
}
function heal(u,v){const h=Math.min(v,u.max-u.hp);u.hp+=h;fx(u,'+'+h,'heal');sfx('heal');const el=uEl(u);if(el){const b=document.createElement('div');b.className='burst heal';el.querySelector('.spw').appendChild(b);setTimeout(()=>b.remove(),650)}}
function uEl(u){return document.getElementById('u_'+u.uid)}
function fx(u,t,c){const el=uEl(u);if(!el)return;const f=document.createElement('div');f.className='float '+(c||'');f.textContent=t;f.style.left=(50+(rand()-.5)*30)+'%';el.appendChild(f);setTimeout(()=>f.remove(),950)}
function tecPose(u){const el=uEl(u),a=ASSETS[u.key];if(!el||!a||!a.tec)return false;sfx('stretch');const spw=el.querySelector('.spw'),base=spw.querySelector('img');if(!base)return false;
  const ov=document.createElement('img');ov.className='spr tecov';ov.style.height=base.height+'px';ov.src=a.tec[0];base.style.visibility='hidden';spw.appendChild(ov);
  setTimeout(()=>{ov.src=a.tec[1]},200);setTimeout(()=>{ov.remove();base.style.visibility=''},750);return true}
function lunge(u){const el=uEl(u);if(!el)return;const c=u.side==='p'?'lunge-r':'lunge-l';el.classList.remove(c);void el.offsetWidth;el.classList.add(c);pose(el.querySelector('img'),'atk',420)}
function banner(t,cls){const b=document.createElement('div');b.className='banner '+(cls||'');b.textContent=t;stage.appendChild(b);setTimeout(()=>b.remove(),1200)}
function enemyAct(u){
  if(!B)return;if(!u.alive)return nextTurn();
  const f=FOES[u.key];
  if(f.boss&&!B.rage&&u.hp<u.max*.5){B.rage=true;u.buff={m:1.3,t:99};stFx(u,'💢 ¡FURIA!','up');banner('¡Furia del capitán!','foe');logB(`${u.n}: «¡¿Cómo os atrevéis?!»`,'e')}
  const mv=(()=>{let t=f.moves.reduce((s,m)=>s+m.w,0),r=rand()*t;for(const m of f.moves){if((r-=m.w)<=0)return m}return f.moves[0]})();
  const foes=aliveS('p');if(!foes.length)return nextTurn();
  lunge(u);
  if(mv.def){u.defBonus=(u.defBonus||0)+mv.def;stFx(u,'🛡️ ¡Defensa ▲!','def');logB(`${u.n} usa ${mv.n}.`,'e')}
  else if(mv.self){u.buff={m:mv.self,t:3};stFx(u,'⚔️ ¡Ataque ▲!','up');banner(mv.n,'foe');logB(`${u.n}: «${mv.n}»`,'e')}
  else if(mv.buffAll){aliveS('e').forEach(a=>{a.buff={m:mv.buffAll,t:2};stFx(a,'⚔️ ¡Ataque ▲!','up')});logB(`${u.n}: «${mv.n}»`,'e')}
  else if(mv.all){banner(mv.n,'foe');foes.forEach(t=>hit(u,t,mv.pow,{ranged:mv.ranged}));logB(`${u.n} usa ${mv.n}.`,'e')}
  else{const t=chance(.5)?foes.reduce((a,b)=>a.hp<b.hp?a:b):pick(foes);hit(u,t,mv.pow,{ranged:mv.ranged});logB(`${u.n} usa ${mv.n} contra ${t.n}.`,'e')}
  refreshUnits();later(nextTurn,700);
}
function act(kind,arg){
  if(!B)return;const u=B.cur;sfx('click');
  if(!u||u.side!=='p'||!['menu','target','tech','items'].includes(B.mode))return;
  if(kind==='back'){PEND=null;B.mode='menu';refreshUnits();return drawMenu()}
  if(kind==='attack'){PEND={run:t=>{lunge(u);banner('¡Ataque!','atk');hit(u,t,1);logB(`${u.n} ataca a ${t.n}.`,'p')}};return askTarget('e')}
  if(kind==='defend'){u.defend=true;u.pe=Math.min(u.peMax,u.pe+2);stFx(u,'🛡️ ¡En guardia! +2 PE','guard');logB(`${u.n} se defiende (+2 PE).`,'p');return endAction()}
  if(kind==='flee'){if(B.opt.story||B.opt.boss){logB('¡No se puede huir de esta pelea!','x');return}
    if(chance(fleeChance())){logB('¡Huida con éxito!','p');B.mode='done';return later(()=>{writeBack();B=null;save();back()},600)}logB('¡No hay forma de escapar!','e');return endAction()}
  if(kind==='techmenu'){B.mode='tech';return drawMenu()}
  if(kind==='itemmenu'){B.mode='items';return drawMenu()}
  if(kind==='tech'){const s=CHARS[u.key].skills.find(x=>x.id===arg);if(!s||u.pe<s.pe)return;
    const run=t=>{u.pe-=s.pe;if(s.t==='self'||!tecPose(u))lunge(u);banner(s.n,'tec');fx(u,'-'+s.pe+' PE','pe');
      if(s.t==='all'){aliveS('e').forEach(e=>hit(u,e,s.pow))}
      else if(s.t==='one'){hit(u,t,s.pow);if(s.bleed&&t.alive){t.bleed=Math.max(t.bleed,s.bleed);stFx(t,'🩸 ¡Sangrado!','bleed')}}
      else if(s.t==='self'){if(s.id==='globo'){u.globo=true;stFx(u,'🎈 ¡Globo!','globo')}if(s.buff){u.buff={m:s.buff,t:3};stFx(u,'⚔️ ¡Ataque ▲!','up')}}
      else if(s.t==='ally'){if(s.heal)heal(t,s.heal);if(s.buff){t.buff={m:s.buff,t:3};stFx(t,'⚔️ ¡Ataque ▲!','up')}}
      logB(`${u.n} usa ${s.n}.`,'p')};
    if(s.t==='one'){PEND={run};return askTarget('e')}if(s.t==='ally'){PEND={run};return askTarget('p')}run();return endAction()}
  if(kind==='combo'){const z=B.P.find(p=>p.key==='zoro'&&p.alive);if(!z||u.pe<4||z.pe<4)return;PEND={run:t=>{u.pe-=4;z.pe-=4;if(!tecPose(u))lunge(u);lunge(z);banner('¡Gomu Gomu... Oni Giri!','combo');hit(u,t,COMBO.pow);logB('¡Ataque combinado de Luffy y Zoro!','p')}};return askTarget('e')}
  if(kind==='item'){const it=ITEMS[arg];if(!G.items[arg])return;
    const run=t=>{G.items[arg]--;if(it.t==='ally'){if(it.heal)heal(t,it.heal);if(it.pe){t.pe=Math.min(t.peMax,t.pe+it.pe);fx(t,'+'+it.pe+' PE','pe')}}
      if(it.t==='party')aliveS('p').forEach(p=>heal(p,it.heal));if(it.t==='foes'){banner('¡Bomba!','atk');aliveS('e').forEach(e=>hit(null,e,0,{fixed:it.dmg}))}logB(`${u.n} usa ${it.n}.`,'p')};
    if(it.t==='ally'){PEND={run};return askTarget('p')}run();return endAction()}
}
function askTarget(side){B.mode='target';B.tside=side;refreshUnits();drawMenu();logB(side==='e'?'Elige un enemigo.':'Elige a un aliado.','x')}
function pickTarget(uid){if(!B||B.mode!=='target')return;const t=B.all.find(x=>x.uid===uid);if(!t||!t.alive||t.side!==B.tside)return;B.mode='busy';const r=PEND.run;PEND=null;r(t);endAction()}
function endAction(){B.mode='busy';refreshUnits();drawMenu();later(nextTurn,700)}
function checkEnd(){
  if(!B)return true;
  if(!aliveS('e').length){B.mode='done';banner('¡Victoria!','win');later(winBattle,900);return true}
  if(!aliveS('p').length){B.mode='done';banner('Derrota','lose');later(loseBattle,900);return true}
  return false;
}
function writeBack(){B.P.forEach(u=>{u.ref.hp=Math.max(1,Math.round(u.hp));u.ref.pe=u.pe})}
function winBattle(){
  if(!B)return;writeBack();const o=B.opt;let xp=0,gold=0;const drops=[];OUT=[];
  B.E.forEach(e=>{const f=FOES[e.key];xp+=f.xp;gold+=ri(f.gold[0],f.gold[1]);(f.drop||[]).forEach(([d,p])=>{if(chance(p))drops.push(d)})});
  if(G.rares.includes('doblon'))gold=Math.round(gold*1.3);
  G.berries+=gold;G.bounty+=Math.round(xp/4);
  const lines=[`<span class="num">+${gold} 💰 · +${xp} XP</span>`];
  drops.forEach(d=>{if(d.startsWith('eq:')){const k=d.slice(3);if(G.bag.includes(k)||G.crew.some(m=>Object.values(m.eq).includes(k)))return;gainEq(k);lines.push(`🎁 ${EQUIP[k].n} (equípalo en la bitácora)`)}else if(d.startsWith('rare:')){gainRare(d.slice(5));lines.push(...OUT.map(x=>x[1]));OUT=[]}else{gainItem(d);lines.push(`🎁 ${ITEMS[d].n}`)}});
  B.P.forEach(u=>{const m=u.ref;m.xp+=xp;while(m.xp>=xpNext(m.lv)&&m.lv<10){m.xp-=xpNext(m.lv);m.lv++;m.sp++;m.hp=stat(m,'hp');m.pe=stat(m,'pe');lines.push(`⭐ ¡${CHARS[m.key].n} sube a nivel ${m.lv}! (+1 punto de técnica)`)}});
  if(B.P.some(p=>p.key==='zoro')&&B.P.some(p=>p.key==='luffy')){const before=Math.floor(G.bond);G.bond=Math.min(5,G.bond+.34);if(Math.floor(G.bond)>before)lines.push(`🤝 Vínculo Luffy–Zoro: ${'★'.repeat(Math.floor(G.bond))}${Math.floor(G.bond)===3?' ¡Ataque combinado desbloqueado!':''}`)}
  const bg=o.bg;B=null;save();stopMusic();sfx('victory');later(()=>sfx('coin'),900);if(lines.some(l=>l.includes('sube a nivel')))later(()=>sfx('levelup'),1400);
  window.afterWin=()=>{o.onWin?o.onWin():back()};
  const luffyOk=G.crew.find(m=>m.key==='luffy');
  stage.innerHTML=`<div class="vnbg" style="${bgStyle(bg||'cubierta')}"></div>${hud()}${luffyOk?`<div class="abs" style="left:8px;bottom:30px;z-index:21">${img("luffywin",190)}</div>`:''}<div class="panel perg"><h1>¡Victoria!</h1>${lines.map(l=>`<p style="margin-top:4px">${l}</p>`).join('')}<button class="primary" style="margin-top:14px" onclick="afterWin()">Continuar</button></div>`;
}
function loseBattle(){
  if(!B)return;const o=B.opt,snap=B.snap,keys=B.keys;B=null;stopMusic();sfx('defeat');
  if(o.story){window.retry=()=>{G=JSON.parse(snap);G.crew.forEach(m=>{m.hp=stat(m,'hp');m.pe=stat(m,'pe')});startBattle(keys,o)};
    stage.innerHTML=`<div class="vnbg" style="${bgStyle(o.bg||'cubierta')}"></div><div class="panel perg"><h1>Derrota</h1><p>Esta pelea es importante. ¿Lo intentas otra vez? La tripulación vuelve con la vida y la energía al máximo.</p><button class="primary" style="margin-top:12px" onclick="retry()">Reintentar</button></div>`;return}
  G=JSON.parse(snap);G.berries=Math.floor(G.berries/2);G.crew.forEach(m=>{m.hp=Math.ceil(stat(m,'hp')*.5)});
  const id=G.lastIsl||'villa',p=islStart(id);G.isl={id,x:p[0],y:p[1],face:1};shipToDock(id);G.mode='island';save();
  stage.innerHTML=`<div class="vnbg" style="${bgStyle('playa')}"></div><div class="panel perg"><h1>Derrota</h1><p>Os despertáis en ${ISLANDS[id].n}, con medio botín menos y muchos chichones.</p><button class="primary" style="margin-top:12px" onclick="renderIsland()">Continuar</button></div>`;
}
function unitHTML(u,i){
  const tg=B.mode==='target'&&u.side===B.tside&&u.alive,big=FOES[u.key]?.boss||FOES[u.key]?.elite,sz=['reymarino','cangrejo'].includes(u.key)?150:big?128:104;
  const [x,y]=SLOTS[u.side][i];
  const aura=(u.buff&&u.buff.m>=1?' buffed':'')+(u.defend||u.defBonus?' guarding':'')+(u.bleed?' bleeding':'')+(u.globo?' ballooned':'');
  return `<div class="unit ${u.side}${aura}${!u.alive&&ASSETS[u.key]?.ko?' hasko':''} ${u===B.cur&&B.mode!=='done'?'turn':''} ${tg?'tgt':''} ${tg&&u.side==='p'?'ally':''} ${u.alive?'':'dead'}" id="u_${u.uid}" style="left:${x-75}px;top:${y-(sz+86)}px" ${tg?`onclick="pickTarget('${u.uid}')"`:''}>
   <div class="spw">${!u.alive&&ASSETS[u.key]?.ko?`<img class="spr" src="${ASSETS[u.key].ko}" style="width:${sz*1.45}px;height:auto;margin-left:-${sz*.2}px">`:img(u.key,sz)}</div><div class="plate"><div class="nm">${u.n}</div><div class="bar hp ${u.side}"><i style="width:${100*u.hp/u.max}%"></i></div><div class="nums">❤️ ${u.hp}/${u.max}${u.side==='p'?` · 🔷 ${u.pe}/${u.peMax}`:''}</div>
   ${u.side==='p'?`<div class="bar pe"><i style="width:${100*u.pe/u.peMax}%"></i></div>`:''}</div>${chipsHTML(u,big)}</div>`;
}
function chipsHTML(u,big){const c=[];
  if(u.buff)c.push(`<span class="chip ${u.buff.m>=1?'up':'down'}">⚔️ ATQ ${u.buff.m>=1?'▲':'▼'}${u.buff.t>50?'':' '+u.buff.t+'t'}</span>`);
  if(u.defBonus)c.push(`<span class="chip def">🛡️ DEF ▲ +${u.defBonus}</span>`);
  if(u.defend)c.push(`<span class="chip guard">🛡️ GUARDIA</span>`);
  if(u.globo)c.push(`<span class="chip globo">🎈 GLOBO</span>`);
  if(u.bleed)c.push(`<span class="chip bleed">🩸 ${u.bleed}</span>`);
  return `<div class="chips" style="top:${big?-8:6}px">${c.join('')}</div>`}
function stFx(u,t,cls){sfx(cls==='bleed'?'debuff':'buff');const el=uEl(u);if(!el)return;const f=document.createElement('div');f.className='float st '+cls;f.textContent=t;f.style.top='30px';el.appendChild(f);setTimeout(()=>f.remove(),1300);
  const b=document.createElement('div');b.className='burst '+cls;el.querySelector('.spw').appendChild(b);setTimeout(()=>b.remove(),650)}
function drawBattle(){
  if(!B)return;
  stage.innerHTML=`<div class="bfield" style="${bgStyle(B.opt.bg||'cubierta')}"></div>${hud()}<div class="queue perg" id="queue"></div>
   <div id="units">${B.P.map(unitHTML).join('')}${B.E.map(unitHTML).join('')}</div>
   <div class="blog perg" id="blog"></div><div class="cmd" id="menu"></div>`;
  logB(B.log.length?B.log.shift()[0]:'¡Comienza el combate!','x');drawQueue();drawMenu();
}
function drawQueue(){const q=document.getElementById('queue');if(!q||!B)return;q.innerHTML=`<span class="lab">Turnos</span>`+[B.cur,...B.queue].filter(u=>u&&u.alive).slice(0,8).map((u,i)=>`<div class="q ${u.side} ${i===0?'now':''}">${img(u.key,36)}</div>`).join('')}
function refreshUnits(){if(!B)return;const w=document.getElementById('units');if(!w)return;
  [...B.P.map((u,i)=>[u,i]),...B.E.map((u,i)=>[u,i])].forEach(([u,i])=>{const el=uEl(u);if(!el)return;const t=document.createElement('div');t.innerHTML=unitHTML(u,i);const nw=t.firstElementChild;
    el.className=nw.className+[...el.classList].filter(c=>c==='lunge-r'||c==='lunge-l'||c==='hitf').map(c=>' '+c).join('');el.querySelector('.plate').innerHTML=nw.querySelector('.plate').innerHTML;if(!u.alive&&ASSETS[u.key]?.ko&&!el.dataset.ko){el.dataset.ko=1;el.querySelector('.spw').innerHTML=nw.querySelector('.spw').innerHTML}el.querySelector('.chips').outerHTML=nw.querySelector('.chips').outerHTML;
    if(nw.getAttribute('onclick'))el.setAttribute('onclick',nw.getAttribute('onclick'));else el.removeAttribute('onclick')});refreshHud()}
function drawMenu(){
  const m=document.getElementById('menu');if(!m||!B)return;const u=B.cur;
  if(!u||B.mode==='done'){m.innerHTML='';return}
  if(u.side==='e'){m.innerHTML=`<div class="cmdhead perg foe">⚔️ Turno de ${u.n}...</div>`;return}
  const head=`<div class="cmdhead perg"><b>Turno de ${u.n}</b><span class="num">❤️ ${u.hp}/${u.max} · 🔷 ${u.pe} PE</span></div>`;
  if(B.mode==='busy'){m.innerHTML=head;return}
  if(B.mode==='target'){m.innerHTML=head+`<button class="cbtn back" onclick="act('back')">← Cancelar · ${B.tside==='e'?'toca un enemigo':'toca un aliado'}</button>`;return}
  if(B.mode==='tech'){const sk=CHARS[u.key].skills.filter(s=>u.ref.skills.includes(s.id));const z=B.P.find(p=>p.key==='zoro'&&p.alive);const combo=u.key==='luffy'&&G.bond>=3&&z;
    m.innerHTML=head+`<div class="cmdlist">${sk.map(s=>`<button class="cbtn t-${s.t}" ${u.pe<s.pe?'disabled':''} onclick="act('tech','${s.id}')"><span class="pe-tag">${s.pe} PE</span>${s.n}<small>${s.d}</small></button>`).join('')}
     ${combo?`<button class="cbtn t-combo" ${u.pe<4||z.pe<4?'disabled':''} onclick="act('combo')"><span class="pe-tag">4+4</span>🤝 ${COMBO.n}<small>${COMBO.d}</small></button>`:''}
     <button class="cbtn back" onclick="act('back')">← Volver</button></div>`;return}
  if(B.mode==='items'){const it=Object.keys(G.items).filter(k=>G.items[k]>0);
    m.innerHTML=head+`<div class="cmdlist">${it.map(k=>`<button class="cbtn t-item" onclick="act('item','${k}')"><span class="pe-tag">×${G.items[k]}</span>${ITEMS[k].n}<small>${ITEMS[k].d}</small></button>`).join('')||'<div class="perg" style="padding:8px">No te queda nada.</div>'}<button class="cbtn back" onclick="act('back')">← Volver</button></div>`;return}
  m.innerHTML=head+`<div class="cmdgrid">
   <button class="cbtn atk" onclick="act('attack')">⚔️ Atacar<small>Golpe normal</small></button>
   <button class="cbtn tec" onclick="act('techmenu')">✨ Técnica<small>Gasta PE</small></button>
   <button class="cbtn obj" onclick="act('itemmenu')">🎒 Objeto<small>Consumibles</small></button>
   <button class="cbtn def" onclick="act('defend')">🛡️ Defender<small>−50% daño · +2 PE</small></button>
   <button class="cbtn run" onclick="act('flee')" ${B.opt.story?'disabled':''}>💨 Huir<small>${B.opt.story?'No se puede':Math.round(fleeChance()*100)+'%'}</small></button></div>`;
}

/* ------------------------------------------------------------------------ */
renderTitle();
</script>
</body>
</html>
